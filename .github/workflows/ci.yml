# SPDX-FileCopyrightText: 2026 Contribuidores do DS4 Companion
#
# CI de todo push e PR. Os jobs de código, pacote e instalador só rodam quando
# os arquivos correspondentes existem (o projeto ainda está em documentação);
# assim o mesmo workflow cresce junto com o código sem precisar ser reescrito.
# O job "ci-ok" é o único check obrigatório na proteção da branch main.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Imagem dos jobs em container: Arch Linux (rolling) fixado por digest.
# Ao atualizar, troque o digest em todos os jobs de uma vez.
env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  detect:
    name: Detectar partes do projeto
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.d.outputs.python }}
      integration: ${{ steps.d.outputs.integration }}
      package: ${{ steps.d.outputs.package }}
      installer: ${{ steps.d.outputs.installer }}
      shell: ${{ steps.d.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: d
        run: |
          has() { if [ -e "$1" ]; then echo true; else echo false; fi; }
          {
            echo "python=$(has pyproject.toml)"
            echo "integration=$(has tests/integration)"
            echo "package=$(has packaging/PKGBUILD)"
            echo "installer=$(has install.sh)"
            if git ls-files '*.sh' ':!.claude/**' | grep -q .; then echo shell=true; else echo shell=false; fi
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  repo:
    name: Repositório (formato, YAML, workflows, SVG, dados sensíveis, SPDX)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Instalar ferramentas fixadas
        run: pip install -r requirements-ci.txt
      - name: Testes dos verificadores
        run: python -I -m unittest discover -s tests/ci -v
      - name: EditorConfig (UTF-8, LF, indentação, espaço no fim)
        run: ec
      - name: YAML
        run: yamllint --strict .
      - name: Workflows (actionlint)
        run: actionlint
      - name: Segurança dos workflows (zizmor)
        run: zizmor --offline --min-severity=low .github/workflows
      - name: SVG
        run: python -I scripts/ci/check_svg.py
      - name: Dados pessoais e arquivos proibidos
        run: python -I scripts/ci/check_sensitive.py
      - name: Cabeçalho SPDX
        run: python -I scripts/ci/check_spdx.py

  commits:
    name: Commits (Conventional Commits, DCO, sem atribuição de IA)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar mensagens
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 -I scripts/ci/check_commits.py "$PR_BASE" "$PR_HEAD"
          elif [ "$EVENT" = push ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            python3 -I scripts/ci/check_commits.py "$PUSH_BEFORE" "$HEAD_SHA"
          else
            python3 -I scripts/ci/check_commits.py --all
          fi

  docs:
    name: Links da documentação
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Links internos (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress
            --exclude-path .claude
            './**/*.md'
          fail: true

  shell:
    name: Scripts de shell (shellcheck)
    needs: detect
    if: needs.detect.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git ls-files -z '*.sh' ':!.claude/**' | xargs -0 shellcheck --severity=style --external-sources

  python:
    name: Python (ruff, mypy --strict, pytest + cobertura, pip-audit)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: archlinux:base-devel@sha256:767de6eaa40dcfeda5263a48737ea03a782caabdf3a403b6e6a203c7fd333681
    steps:
      - name: Dependências do Arch (só repositório extra)
        run: |
          pacman -Syu --noconfirm --needed git python python-pip python-gobject python-cairo gtk4 libadwaita \
            python-pyudev python-dbus-next inter-font xorg-server-xvfb dbus
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ambiente
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/pip install -e '.[dev]' -r requirements-ci.txt
      - name: Lint
        run: .venv/bin/ruff check --output-format=github .
      - name: Formatação
        run: .venv/bin/ruff format --check .
      - name: Tipagem
        run: .venv/bin/mypy --strict src/
      - name: Testes unitários (GUI em Xvfb, D-Bus de sessão isolado)
        run: |
          dbus-run-session -- xvfb-run -a .venv/bin/pytest \
            --ignore=tests/integration --strict-markers -ra \
            --cov=ds4_companion --cov-branch --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=80 --junitxml=junit.xml
      - name: Vulnerabilidades nas dependências Python
        # O próprio pacote está instalado como editável e o --strict trataria isso como falha;
        # por isso a auditoria lê o freeze sem ele. O venv enxerga todos os pacotes Python do
        # Arch (--system-site-packages), e alguns não existem no PyPI (ex.: nftables), o que o
        # --strict também reprova: audita o que o pip instalou no venv (--local) mais as
        # dependências do app que vêm do pacman. O resto do sistema é responsabilidade do Arch.
        # Em caso de falha, cada linha da saída vira uma anotação, visível sem acesso aos logs.
        run: |
          {
            .venv/bin/pip freeze --local --exclude-editable
            .venv/bin/pip freeze --exclude-editable | grep -iE '^(pyudev|dbus[-_]next|pygobject)=='
          } | sort -u > "$RUNNER_TEMP/requisitos.txt"
          if ! .venv/bin/pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/requisitos.txt" \
              > "$RUNNER_TEMP/pip-audit.txt" 2>&1; then
            cat "$RUNNER_TEMP/requisitos.txt" "$RUNNER_TEMP/pip-audit.txt"
            while IFS= read -r linha; do
              linha=${linha//'%'/'%25'}
              echo "::error title=pip-audit::${linha}"
            done < "$RUNNER_TEMP/pip-audit.txt"
            exit 1
          fi
          cat "$RUNNER_TEMP/pip-audit.txt"
      - name: Build do pacote Python (sdist + wheel)
        run: .venv/bin/python -m build --no-isolation --outdir dist/
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-relatorios
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: ignore

  integration:
    name: Integração (PipeWire de teste fingindo ser o RPCS3)
    needs: [detect, python]
    if: needs.detect.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: archlinux:base-devel@sha256:767de6eaa40dcfeda5263a48737ea03a782caabdf3a403b6e6a203c7fd333681
    steps:
      - name: Dependências
        run: |
          pacman -Syu --noconfirm --needed git python python-pip python-gobject python-pyudev \
            python-dbus-next pipewire pipewire-audio wireplumber dbus
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ambiente
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/pip install -e '.[dev]'
      - name: PipeWire + WirePlumber isolados e testes
        run: dbus-run-session -- scripts/ci/run-integration.sh

  package:
    name: Pacote do Arch (makepkg, namcap, .SRCINFO, validação de arquivos)
    needs: detect
    if: needs.detect.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:base-devel@sha256:767de6eaa40dcfeda5263a48737ea03a782caabdf3a403b6e6a203c7fd333681
    steps:
      - name: Ferramentas
        run: pacman -Syu --noconfirm --needed git namcap desktop-file-utils appstream systemd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Usuário de build (makepkg não roda como root)
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder: .
      - name: namcap no PKGBUILD
        run: namcap packaging/PKGBUILD
      - name: .SRCINFO em dia
        working-directory: packaging
        run: |
          su builder -c 'makepkg --printsrcinfo' > /tmp/SRCINFO
          diff -u .SRCINFO /tmp/SRCINFO
      - name: Build
        working-directory: packaging
        run: su builder -c 'makepkg --syncdeps --noconfirm --cleanbuild'
      - name: namcap no pacote
        working-directory: packaging
        run: namcap ./*.pkg.tar.zst
      - name: Instalar e validar arquivos instalados
        working-directory: packaging
        run: |
          pacman -U --noconfirm ./*.pkg.tar.zst
          ds4ctl --version
          ds4-companion --version
          desktop-file-validate /usr/share/applications/io.github.luizfelipe_pacifico.DS4Companion.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.luizfelipe_pacifico.DS4Companion.metainfo.xml
          # Sem sessão de usuário no container, o verify precisa de um XDG_RUNTIME_DIR qualquer.
          XDG_RUNTIME_DIR="$(mktemp -d)" systemd-analyze verify --user /usr/lib/systemd/user/ds4-companion.service
          udevadm verify /usr/lib/udev/rules.d/70-ds4-companion.rules
          pacman -R --noconfirm ds4-companion
          test ! -e /usr/bin/ds4ctl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacote-arch
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error

  installer:
    name: Instalador (install.sh num Arch limpo)
    needs: [detect, package]
    if: needs.detect.outputs.installer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: archlinux:base-devel@sha256:767de6eaa40dcfeda5263a48737ea03a782caabdf3a403b6e6a203c7fd333681
    steps:
      - run: pacman -Syu --noconfirm --needed git sudo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pacote-arch
          path: dist
      - name: Instalar, conferir e desinstalar como usuário comum
        run: |
          useradd -m usuario
          echo 'usuario ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/usuario
          chown -R usuario: .
          su usuario -c './install.sh --package dist/*.pkg.tar.zst --no-service'
          command -v ds4ctl
          su usuario -c './install.sh --uninstall --no-service'
          ! command -v ds4ctl

  ci-ok:
    name: CI ok
    if: always()
    needs: [detect, repo, commits, docs, shell, python, integration, package, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Todos os jobs passaram ou foram pulados
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
